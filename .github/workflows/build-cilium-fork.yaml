name: Build cilium agent image (fork)

on:
  push:
    branches:
      - egressip-ifindex-*
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Unit test egressgateway
        run: |
          builder=$(sed -n 's/^ARG CILIUM_BUILDER_IMAGE=//p' images/cilium/Dockerfile)
          docker run --rm -v "$PWD":/go/src/github.com/cilium/cilium \
            -w /go/src/github.com/cilium/cilium "$builder" \
            go test ./pkg/egressgateway/...

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tag
        id: tag
        run: echo "tag=$(cat VERSION)-${GITHUB_REF_NAME%%-v*}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          provenance: false
          context: .
          file: ./images/cilium/Dockerfile
          target: release
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/cilium:${{ steps.tag.outputs.tag }}
